<!doctype html>

<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10131c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Calc Roguelike"><link rel="manifest" href="manifest.json"><title>Calc Roguelike</title>
<style>
:root{color-scheme:dark;--bg:#111116;--panel:#202027;--panel2:#2c2c36;--line:#41414d;--text:#f7f7fb;--muted:#a4a4b2;--lime:#d6ff4f;--pink:#ff6685;--blue:#8b9cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#30303b 0%,var(--bg) 58%);color:var(--text);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh;overscroll-behavior:none}button{font:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}#app{width:min(100%,520px);margin:0 auto;padding:env(safe-area-inset-top) 16px calc(18px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column;gap:14px}.top{display:flex;align-items:center;justify-content:space-between;padding-top:12px}.brand{font-size:12px;letter-spacing:.19em;color:var(--lime);font-weight:900}.topright{display:flex;gap:8px}.pill{border:1px solid var(--line);background:#151b29;border-radius:999px;padding:7px 11px;font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:rgba(26,32,48,.9);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.stat span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}.stat strong{font-size:19px;display:block;margin-top:3px}.arena{border:1px solid var(--line);background:linear-gradient(145deg,#202a3d,#171d2b);border-radius:22px;padding:18px;position:relative;overflow:hidden;box-shadow:0 10px 30px #0005}.arena:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--lime)}.roundline{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.boss{color:var(--pink);font-weight:800}.targetlabel{margin-top:17px;text-align:center;color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase}.target{font-size:clamp(36px,11vw,56px);font-weight:900;text-align:center;line-height:1.05;margin:5px 0 14px;letter-spacing:-.04em}.display{border-radius:15px;background:#0c111a;border:1px solid #3a4962;padding:15px 12px;text-align:center;box-shadow:inset 0 0 25px #080b11}.display small{color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.current{font-size:clamp(38px,12vw,58px);font-weight:900;color:var(--lime);line-height:1.1;margin-top:4px;overflow-wrap:anywhere}.message{min-height:22px;text-align:center;font-size:12px;color:var(--muted);padding-top:10px}.message.good{color:var(--lime)}.message.bad{color:var(--pink)}.turns{display:flex;justify-content:center;gap:5px;margin-top:8px}.turn{height:5px;flex:1;max-width:42px;border-radius:8px;background:#39445a}.turn.used{background:var(--lime)}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:0 2px}.sectionhead h2{font-size:14px;margin:0}.sectionhead span{font-size:11px;color:var(--muted)}.keypad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.key{min-height:65px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(180deg,#34343f,#25252e);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;box-shadow:0 3px 0 #08080c;transition:transform .08s,border-color .1s}.key:active{transform:translateY(2px);box-shadow:0 1px 0 #0b101a}.key .symbol{font-size:25px;font-weight:900}.key .desc{font-size:10px;color:var(--muted)}.key .charges{position:absolute;right:8px;top:7px;font-size:10px;color:var(--lime);font-weight:800}.key:disabled{opacity:.35;filter:grayscale(.7)}.key.special{border-color:#5c6c87}.bottomrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:1px solid var(--line);border-radius:14px;padding:13px;background:#1b2435;color:var(--text);font-weight:800}.btn.primary{background:var(--lime);color:#18200e;border-color:var(--lime)}.btn:disabled{opacity:.35}.footer{display:flex;justify-content:space-between;color:#68748c;font-size:10px;padding:0 3px;margin-top:auto}.overlay{position:fixed;inset:0;background:#070a10d9;backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:5;padding:12px}.overlay.show{display:flex}.sheet{width:min(100%,500px);max-height:88dvh;overflow:auto;background:#171e2d;border:1px solid var(--line);border-radius:24px;padding:20px}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheet h2{font-size:22px;margin:0}.close{background:#2a354a;border:0;color:white;border-radius:50%;width:34px;height:34px;font-size:20px}.shopitem{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #2c364b}.itemicon{width:44px;height:44px;border-radius:12px;background:#27344b;display:grid;place-items:center;font-size:23px;color:var(--lime);flex-shrink:0}.itemtext{flex:1}.itemtext strong{display:block;font-size:13px}.itemtext small{color:var(--muted);font-size:11px;display:block;margin-top:3px;line-height:1.4}.buy{border:0;border-radius:11px;background:var(--lime);color:#18200e;font-weight:900;padding:10px 12px;white-space:nowrap}.buy:disabled{opacity:.35}.modalbuttons{display:flex;gap:9px;margin-top:16px}.modalbuttons .btn{flex:1}.notice{background:#202a3c;border-radius:12px;padding:12px;color:var(--muted);font-size:12px;line-height:1.5;margin-top:12px}.hidden{display:none!important}@media(min-height:820px){#app{padding-top:20px;gap:16px}.key{min-height:88px}}
</style></head><body><main id="app"><header class="top"><div><div class="brand">CALC // ROGUELIKE</div><div style="font-size:11px;color:var(--muted);margin-top:3px">Собери калькулятор. Победи раунд.</div></div><div class="topright"><div class="pill">◈ <b id="coinsTop">0</b></div><button class="pill" id="resetBtn" aria-label="Начать заново">↻</button></div></header>
<section class="stats"><div class="stat"><span>Раунд</span><strong id="roundStat">1 / 10</strong></div><div class="stat"><span>Ходы</span><strong id="movesStat">0 / 5</strong></div><div class="stat"><span>Заряды</span><strong id="chargeStat">—</strong></div></section>
<section class="arena"><div class="roundline"><span id="roundLabel">ЗАДАЧА 01</span><span id="bossLabel" class="boss"></span></div><div class="targetlabel">достигни числа</div><div class="target" id="target">24</div><div class="display"><small>текущее значение</small><div class="current" id="current">1</div></div><div class="turns" id="turnDots"></div><div class="message" id="message" aria-live="polite">Выбери кнопку, чтобы изменить число.</div></section>
<div class="sectionhead"><h2>ТВОИ КНОПКИ</h2><button class="pill" id="arrangeBtn">↔ Расставить</button></div><section class="keypad" id="keypad"></section><div class="bottomrow"><button class="btn" id="shopBtn">▦ Магазин</button><button class="btn primary" id="submitBtn">Проверить ↗</button></div><div class="footer"><span>CALC ROGUELIKE · DEMO</span><span id="bestLabel">Лучший раунд: 0</span></div></main>
<div class="overlay" id="overlay"><section class="sheet"><div class="sheethead"><div><div class="brand" id="sheetEyebrow">ПЕРЕДЫШКА</div><h2 id="sheetTitle">Магазин</h2></div><button class="close" id="closeSheet">×</button></div><div id="sheetBody"></div><div class="modalbuttons"><button class="btn" id="continueBtn">Продолжить</button><button class="btn primary hidden" id="restartRunBtn">Новая попытка</button></div></section></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const baseButtons=[...Array.from({length:10},(_,d)=>({id:'digit'+d,symbol:String(d),desc:'Добавить цифру '+d,cost:0,charges:99,fn:n=>Number(String(Math.abs(Math.trunc(n)))+String(d))*(n<0?-1:1)})),{id:'plus1',symbol:'+1',desc:'Прибавить 1',cost:0,charges:9,fn:n=>n+1},{id:'plus3',symbol:'+3',desc:'Прибавить 3',cost:0,charges:5,fn:n=>n+3},{id:'double',symbol:'×2',desc:'Удвоить число',cost:0,charges:3,fn:n=>n*2},{id:'minus2',symbol:'−2',desc:'Вычесть 2',cost:0,charges:4,fn:n=>n-2},{id:'square',symbol:'x²',desc:'Возвести в квадрат',cost:0,charges:2,fn:n=>n*n},{id:'reverse',symbol:'⇄',desc:'Перевернуть цифры',cost:0,charges:2,fn:n=>Number(String(Math.abs(Math.trunc(n))).split('').reverse().join(''))*(n<0?-1:1)}];const shopItems=[{id:'plus5',symbol:'+5',name:'Кнопка «+5»',desc:'Добавляет 5. 4 заряда на раунд.',price:5,button:{id:'plus5',symbol:'+5',desc:'Прибавить 5',charges:4,fn:n=>n+5}},{id:'minus5',symbol:'−5',name:'Кнопка «−5»',desc:'Вычитает 5. 4 заряда на раунд.',price:5,button:{id:'minus5',symbol:'−5',desc:'Вычесть 5',charges:4,fn:n=>n-5}},{id:'triple',symbol:'×3',name:'Кнопка «×3»',desc:'Умножает на 3. 2 заряда на раунд.',price:8,button:{id:'triple',symbol:'×3',desc:'Умножить на 3',charges:2,fn:n=>n*3}},{id:'heal',symbol:'↻',name:'Запасной аккумулятор',desc:'Восстанавливает по 2 заряда всем кнопкам каждый раунд.',price:10,passive:'battery'},{id:'purse',symbol:'◈',name:'Медная копилка',desc:'Получай +2 монеты за каждый пройденный раунд.',price:12,passive:'purse'},{id:'extra',symbol:'+1',name:'Ещё один ход',desc:'Добавляет один ход к каждой задаче.',price:9,passive:'extra'}];let state;function fresh(){return{round:1,coins:8,current:1,target:24,moves:0,maxMoves:5,buttons:[...Array.from({length:10},(_,d)=>'digit'+d),'plus1','plus3','double','minus2','square','reverse'],inventory:[],charges:{},ownedPassives:[],won:0,gameOver:false,shopOpen:false,boss:false,best:0};}function load(){try{const s=JSON.parse(localStorage.getItem('calcRogueSave'));if(s&&s.round&&s.buttons){if(!Array.isArray(s.inventory))s.inventory=[];const digits=Array.from({length:10},(_,d)=>'digit'+d);s.buttons=[...digits.filter(id=>!s.buttons.includes(id)),...s.buttons];if(!s.charges)s.charges={};digits.forEach(id=>{if(s.charges[id]==null)s.charges[id]=99});return s}}catch(e){}return fresh()}state=load();function save(){try{localStorage.setItem('calcRogueSave',JSON.stringify(state))}catch(e){}}function getButton(id){for(const b of baseButtons)if(b.id===id)return b;for(const it of shopItems)if(it.button&&it.button.id===id)return it.button;return null}function newRound(keepCoins=true){state.current=1;state.moves=0;state.maxMoves=5+(state.ownedPassives.includes('extra')?1:0);state.boss=state.round%5===0;let targets=[12,18,24,27,32,36,42,48,54,64,72,81,96,108,128];let t=targets[Math.floor(Math.random()*targets.length)];if(state.boss)t+=12;state.target=t;state.charges={};state.buttons.forEach(id=>{const b=getButton(id);if(b)state.charges[id]=b.charges+(state.ownedPassives.includes('battery')?2:0)});state.message='Выбери кнопку, чтобы изменить число.';save();render()}state.message='';if(!state.target||!state.charges||state.round===1&&state.moves===0&&state.current===1&&Object.keys(state.charges).length===0)newRound();function msg(text,kind=''){const el=$('message');el.textContent=text;el.className='message '+kind;state.message=text}function useButton(id){if(state.gameOver)return;const b=getButton(id);if(!b||state.moves>=state.maxMoves)return;if((state.charges[id]||0)<=0){msg('У этой кнопки закончились заряды.','bad');return}let n=b.fn(state.current);if(!Number.isFinite(n)||Math.abs(n)>999999){msg('Слишком большое число! Ход не засчитан.','bad');return}state.current=Math.trunc(n);state.charges[id]--;state.moves++;msg(`${b.symbol}: новое значение ${state.current}.`, '');render();save();if(state.current===state.target)winRound();else if(state.moves>=state.maxMoves)msg('Ходы закончились. Нажми «Проверить».','bad')}function winRound(){const remaining=state.maxMoves-state.moves;let earned=3+remaining+(state.ownedPassives.includes('purse')?2:0);state.coins+=earned;state.won++;state.best=Math.max(state.best,state.round);msg(`Точно! +${earned} монет.`, 'good');save();render();setTimeout(()=>showRoundWin(earned),350)}function submit(){if(state.gameOver)return;if(state.current===state.target){if(state._winShown)return;state._winShown=true;showRoundWin(0);return}if(state.moves>=state.maxMoves){state.gameOver=true;save();showGameOver();return}msg(`Пока ${state.current}, нужно ${state.target}. Ещё есть ходы!`,'bad')}function showRoundWin(earned){if(state._shopAfterWin)return;state._shopAfterWin=true;$('sheetEyebrow').textContent=state.boss?'БОСС ПОВЕРЖЕН':'РАУНД ПРОЙДЕН';$('sheetTitle').textContent='Отличная работа!';$('sheetBody').innerHTML=`<div class="notice">Цель <b style="color:var(--lime)">${state.target}</b> достигнута за ${state.moves} ход(а).${earned?` Награда: <b style="color:var(--lime)">+${earned} ◈</b>.`:''} ${state.boss?'Босс побеждён — магазин открыт.':''}</div><div class="notice">В магазине можно добавить кнопки и пассивные улучшения. Старайся тратить меньше ходов, чтобы получать больше монет.</div>`;$('restartRunBtn').classList.add('hidden');$('continueBtn').textContent='Открыть магазин';$('overlay').classList.add('show');$('continueBtn').onclick=()=>{state.round++;state._winShown=false;state._shopAfterWin=false;newRound();showShop()};}
function showShop(){state.shopOpen=true;$('sheetEyebrow').textContent='ПОДГОТОВКА';$('sheetTitle').textContent='Магазин';renderShop();$('continueBtn').textContent='В бой';$('continueBtn').onclick=()=>{$('overlay').classList.remove('show');state.shopOpen=false;save()};$('restartRunBtn').classList.add('hidden');$('overlay').classList.add('show')}function renderShop(){let html=`<div class="notice">Баланс: <b style="color:var(--lime)">${state.coins} ◈</b> · Кнопок на панели: ${state.buttons.length} · В запасе: ${state.inventory.length}</div>`;for(const it of shopItems){let owned=it.button?state.buttons.includes(it.button.id):state.ownedPassives.includes(it.passive);html+=`<div class="shopitem"><div class="itemicon">${it.symbol}</div><div class="itemtext"><strong>${it.name}${owned?' ✓':''}</strong><small>${it.desc}</small></div><button class="buy" data-buy="${it.id}" ${owned||state.coins<it.price?'disabled':''}>${owned?'Есть':it.price+' ◈'}</button></div>`}$('sheetBody').innerHTML=html;$('sheetBody').querySelectorAll('[data-buy]').forEach(btn=>btn.addEventListener('click',()=>buy(btn.dataset.buy)))}function buy(id){const it=shopItems.find(x=>x.id===id);if(!it||state.coins<it.price)return;if(it.button&&state.buttons.includes(it.button.id))return;if(it.passive&&state.ownedPassives.includes(it.passive))return;if(it.button&&state.buttons.length>=9){alert('Калькулятор вмещает максимум 9 кнопок в демоверсии.');return}state.coins-=it.price;if(it.button)state.inventory.push(it.button.id);if(it.passive)state.ownedPassives.push(it.passive);save();render();renderShop();if(it.button)showArrange(it.button.id)}function showArrange(preselect=''){state._placing=preselect||'';$('sheetEyebrow').textContent='СВОЙ КАЛЬКУЛЯТОР';$('sheetTitle').textContent='Расстановка кнопок';renderArrange();$('continueBtn').textContent='Готово';$('continueBtn').onclick=()=>{$('overlay').classList.remove('show');state._placing='';save()};$('restartRunBtn').classList.add('hidden');$('overlay').classList.add('show')}
function renderArrange(){let selected=state._placing||'';let html=`<div class="notice">Выбери купленную кнопку внизу, затем нажми на кнопку в калькуляторе, вместо которой хочешь её поставить. Цифры 0–9 всегда остаются на месте.</div><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:12px 0">`;
for(const id of state.buttons){const b=getButton(id);if(!b)continue;const fixed=id.startsWith('digit');html+=`<button class="key" style="min-height:58px;${selected?'border-color:var(--lime)':''}" data-slot="${id}" ${fixed?'disabled':''}><span class="symbol" style="font-size:20px">${b.symbol}</span><span class="desc">${fixed?'Цифра':'Нажми, чтобы заменить'}</span></button>`}
html+='</div><div class="sectionhead"><h2>КУПЛЕННЫЕ КНОПКИ</h2><span>'+state.inventory.length+' в запасе</span></div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">';
for(const id of state.inventory){const b=getButton(id);if(!b)continue;html+=`<button class="btn" style="${selected===id?'background:var(--lime);color:#111':''}" data-pick="${id}">${b.symbol} · ${b.desc}</button>`}
if(!state.inventory.length)html+='<div class="notice">Пока нет купленных кнопок. Купи новую в магазине — она появится здесь.</div>';
html+='</div>';$('sheetBody').innerHTML=html;$('sheetBody').querySelectorAll('[data-pick]').forEach(btn=>btn.addEventListener('click',()=>{state._placing=btn.dataset.pick;renderArrange()}));$('sheetBody').querySelectorAll('[data-slot]').forEach(btn=>btn.addEventListener('click',()=>{const slot=btn.dataset.slot;if(!state._placing||slot.startsWith('digit'))return;const i=state.buttons.indexOf(slot);if(i<0)return;state.buttons[i]=state._placing;state.inventory=state.inventory.filter(x=>x!==state._placing);state.inventory.push(slot);state.charges[state._placing]=getButton(state._placing).charges;state._placing='';save();render();renderArrange()}))}
function showGameOver(){ $('sheetEyebrow').textContent='ЗАПУСК ЗАВЕРШЁН';$('sheetTitle').textContent='Не хватило ходов';$('sheetBody').innerHTML=`<div class="notice">Ты дошёл до раунда <b>${state.round}</b> и накопил <b style="color:var(--lime)">${state.coins} ◈</b>. Ничего — собери другой набор кнопок и попробуй снова.</div>`;$('continueBtn').textContent='Закрыть';$('continueBtn').onclick=()=>$('overlay').classList.remove('show');$('restartRunBtn').classList.remove('hidden');$('overlay').classList.add('show')}
function render(){ $('coinsTop').textContent=state.coins;$('roundStat').textContent=`${state.round} / ∞`;$('movesStat').textContent=`${state.moves} / ${state.maxMoves}`;$('chargeStat').textContent=state.buttons.reduce((a,id)=>a+(state.charges[id]||0),0);$('roundLabel').textContent=`ЗАДАЧА ${String(state.round).padStart(2,'0')}`;$('bossLabel').textContent=state.boss?'⚠ БОСС':'';$('target').textContent=state.target;$('current').textContent=state.current;$('bestLabel').textContent=`Лучший раунд: ${state.best||0}`;$('turnDots').innerHTML=Array.from({length:state.maxMoves},(_,i)=>`<div class="turn ${i<state.moves?'used':''}"></div>`).join('');$('keypad').innerHTML=state.buttons.map(id=>{const b=getButton(id);if(!b)return'';let c=state.charges[id]||0;let disabled=c<=0||state.moves>=state.maxMoves||state.gameOver;return `<button class="key ${['square','reverse','triple'].includes(id)?'special':''}" data-key="${id}" ${disabled?'disabled':''}>${id.startsWith('digit')?'':`<span class="charges">${c}×</span>`}<span class="symbol">${b.symbol}</span><span class="desc">${b.desc}</span></button>`}).join('');$('keypad').querySelectorAll('[data-key]').forEach(btn=>btn.addEventListener('click',()=>useButton(btn.dataset.key)));$('shopBtn').disabled=state.gameOver;$('submitBtn').disabled=state.gameOver; if(state.message){$('message').textContent=state.message}}
$('shopBtn').addEventListener('click',showShop);$('arrangeBtn').addEventListener('click',()=>showArrange());$('submitBtn').addEventListener('click',submit);$('closeSheet').addEventListener('click',()=>$('overlay').classList.remove('show'));$('restartRunBtn').addEventListener('click',()=>{const best=state.best||0;state=fresh();state.best=best;newRound();$('overlay').classList.remove('show')});$('resetBtn').addEventListener('click',()=>{if(confirm('Начать новую попытку? Текущий прогресс будет сброшен.')){const best=state.best||0;state=fresh();state.best=best;newRound();$('overlay').classList.remove('show')}});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();})();
</script></body></html>
